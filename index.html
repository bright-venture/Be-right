<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Be Right — Reliable Services in Lebanon</title>
    <meta
      name="description"
      content="Be Right by Bright — book vetted plumbers, electricians, AC techs, cleaners and more for homes, restaurants, offices, buildings and businesses across Lebanon. Approve the price before dispatch. If it's not right, we come back — free."
    />
    <meta name="theme-color" content="#0C2B5C" />
    <link rel="canonical" href="https://be-rightbright.com/" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Social previews (WhatsApp, Facebook, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Be Right by Bright" />
    <meta property="og:title" content="Be Right — Reliable Services in Lebanon" />
    <meta
      property="og:description"
      content="Fast. Fair. Safe. Guaranteed. Book vetted services for homes, restaurants, offices, buildings and businesses anywhere in Lebanon — approve the price before dispatch, free revisit within 7 days if it's not right."
    />
    <meta property="og:url" content="https://be-rightbright.com/" />
    <meta property="og:image" content="https://be-rightbright.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_LB" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Load critical assets early: fonts and the hero bird (drawn from the intro's poster frame) -->
    <link rel="preload" href="/fonts/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/rubik-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="/assets/bird-intro-poster.jpg" fetchpriority="high" />

    <!-- For search engines: who we are and what we offer (data only, not executed). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Be Right by Bright",
        "url": "https://be-rightbright.com",
        "image": "https://be-rightbright.com/og-image.png",
        "description": "Managed services and maintenance for homes, restaurants, offices, buildings and businesses in Lebanon — vetted technicians, prices approved before dispatch, and a free-revisit guarantee on every job.",
        "areaServed": { "@type": "Country", "name": "Lebanon" },
        "slogan": "Fast. Fair. Safe. Guaranteed.",
        "knowsLanguage": ["en", "ar"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services and maintenance",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Plumbing", "areaServed": "Lebanon" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Electrical", "areaServed": "Lebanon" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Air conditioning", "areaServed": "Lebanon" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Carpentry", "areaServed": "Lebanon" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Painting & repairs", "areaServed": "Lebanon" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cleaning", "areaServed": "Lebanon" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Porter", "areaServed": "Lebanon" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Valet & event staff", "areaServed": "Lebanon" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Security", "areaServed": "Lebanon" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Landscaping", "areaServed": "Lebanon" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Appliance repair", "areaServed": "Lebanon" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
