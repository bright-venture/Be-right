[build]
  command = "npm run build:netlify"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Privacy Policy: delete rejected applicants' documents after the retention period.
[functions."cleanup-documents"]
  schedule = "@daily"

# Security headers for every page (the API sets its own in server/app.ts).
# The Content-Security-Policy lists every outside origin the site loads from:
# Supabase (sign-in, uploads, signed photo links), map tiles (OpenStreetMap, or MapTiler
# when VITE_MAPTILER_KEY is set) and Cloudflare Web Analytics (when its token is set).
# Changing Supabase project? Update its address below.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://api.maptiler.com https://vtdubtfezylkodxuodtt.supabase.co; media-src 'self' blob: https://vtdubtfezylkodxuodtt.supabase.co; font-src 'self'; connect-src 'self' https://vtdubtfezylkodxuodtt.supabase.co https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Browser caching. Built JS/CSS have content hashes in their names: keep them a year.
[[headers]]
  for = "/_app/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts and images keep their names when replaced, so cache them for a while only.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# API → the single server function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single-page app. Its pages (keep in sync with src/App.tsx; server/routes.test.ts
# checks) are served index.html. "/" and real files (JS, images…) are served as they are.
[[redirects]]
  from = "/book"
  to = "/index.html"
  status = 200

